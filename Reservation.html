<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réservation | WELtasty</title>
    <link rel="stylesheet" href="Reservation.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <main class="reservation-layout">
        <section class="reservation-intro">
            <a class="back-link" href="index.html"><i class="fa-solid fa-arrow-left"></i> Retour à l'accueil</a>
            <p class="eyebrow">Un moment rien qu'à vous</p>
            <h1>Réservez votre<br><span>table idéale.</span></h1>
            <p class="intro-text">WELtasty vous accueille pour vos dîners, anniversaires et moments précieux.</p>
            <div class="intro-note"><i class="fa-regular fa-clock"></i><span><strong>Un cadre exceptionnel</strong><small>Nous préparons chaque détail pour votre arrivée.</small></span></div>
        </section>

        <section class="reservation-panel">
            <div class="panel-heading"><div><p class="eyebrow">Votre réservation</p><h2>Préparer votre visite</h2></div><i class="fa-regular fa-calendar-check"></i></div>
            <form action="#" method="post">
                <fieldset>
                    <legend>Date et occasion</legend>
                    <div class="form-grid">
                        <label for="date"><i class="fa-regular fa-calendar"></i> Date<input id="date" name="date" type="date" required></label>
                        <label for="heure"><i class="fa-regular fa-clock"></i> Heure<input id="heure" name="heure" type="time" required></label>
                        <label class="full-width" for="occasion">Occasion<select id="occasion" name="occasion" required><option value="">Sélectionner votre occasion</option><option>Dîner</option><option>Anniversaire</option><option>Demande en mariage</option><option>Réunion familiale</option><option>Événement privé</option></select></label>
                        <label class="full-width" for="personnes">Nombre de personnes<input id="personnes" name="personnes" type="number" min="1" max="50" placeholder="Ex. : 4" required></label>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Vos coordonnées</legend>
                    <div class="form-grid">
                        <label for="nom">Nom<input id="nom" name="nom" type="text" required></label>
                        <label for="prenom">Prénom<input id="prenom" name="prenom" type="text" required></label>
                        <label for="sexe">Sexe<select id="sexe" name="sexe"><option value="">Sélectionner</option><option>Masculin</option><option>Féminin</option></select></label>
                        <label for="numero">Numéro de téléphone<input id="numero" name="numero" type="tel" required></label>
                        <label class="full-width" for="email">Adresse e-mail<input id="email" name="email" type="email" required></label>
                    </div>
                </fieldset>
                <button class="confirm-button" type="submit"><i class="fa-regular fa-calendar-check"></i> Confirmer ma réservation</button>
            </form>
        </section>
    </main>
</body>
</html>
